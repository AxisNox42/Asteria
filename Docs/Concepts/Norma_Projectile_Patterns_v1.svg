<text class="t1" x="30.0" y="56.0" text-anchor="start">NORMA · 직접 투사체 패턴 5–7</text>
<text class="t2" x="30.0" y="92.0" text-anchor="start">보스 탄은 쏜 공간에 속한다 · 창 경계에서 소멸 → 창은 엄폐물 (반사 창만 예외적으로 튕겨낸다)</text>
<rect class="frame" x="30.0" y="130.0" width="570.0" height="850.0"/>
