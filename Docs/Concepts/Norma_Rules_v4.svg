<text class="t1" x="30.0" y="56.0" text-anchor="start">NORMA v4 · 창 규칙 정리</text>
<text class="t2" x="30.0" y="92.0" text-anchor="start">어그로와 이동은 경계를 넘는다 · 눈에 보이는 공격과 효과는 못 넘는다 · 창은 진짜 OS 창</text>
