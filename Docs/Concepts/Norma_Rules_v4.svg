<text class="h" x="635.0" y="160.0" text-anchor="start">2. 못 넘는 것: 투사체 · 레이저 · 효과</text>
<text class="p" x="635.0" y="188.0" text-anchor="start">원거리 몹은 쏘기는 하지만 탄은 경계에서 흩어진다</text>
