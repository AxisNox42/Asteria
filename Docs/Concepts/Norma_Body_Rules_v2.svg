<text class="p" x="935.0" y="590.0" text-anchor="start">창 위에는 레굴루스가 아군에게 씌우는 것과 같은 모서리 괄호만 남는다.</text>
<text class="p" x="935.0" y="616.0" text-anchor="start">보스와 창 사이에 계속 이어진 선은 없다. 창을 닫거나 순서를 바꾸거나</text>
<text class="p" x="935.0" y="642.0" text-anchor="start">반사를 걸 때만 같은 레이저가 다시 한 번 번쩍인다.</text>
