<text class="s" x="485.0" y="502.0" text-anchor="start">즉발 3연발 · 매번 다시 조준 · 창이 레이저를 막음</text>
<text class="p" x="55.0" y="550.0" text-anchor="start">대응: 조준선 옆으로 비키거나 창에 들어가 막는다.</text>
<text class="p" x="55.0" y="576.0" text-anchor="start">예고는 나를 향한 한 줄 + 내 둘레 작은 괄호</text>
