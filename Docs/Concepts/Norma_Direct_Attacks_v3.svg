<text class="s" x="485.0" y="1022.0" text-anchor="start">네 변이 궤도를 돌고 돌아옴 · 그동안 본체 방어 꺼짐</text>
<text class="p" x="55.0" y="1070.0" text-anchor="start">대응: 궤도 선을 넘을 때 변 사이 틈을 탄다.</text>
<text class="p" x="55.0" y="1096.0" text-anchor="start">변이 나간 동안 본체 방어가 꺼져 있어 안쪽이 공격 기회</text>
