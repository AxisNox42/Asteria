<text class="s" x="1365.0" y="502.0" text-anchor="start">사각 탄 4줄기가 돌며 나선을 그린다</text>
<text class="p" x="935.0" y="550.0" text-anchor="start">대응: 회전 방향을 보고 줄기 사이 빈 각도로 따라 돈다.</text>
<text class="p" x="935.0" y="576.0" text-anchor="start">예고는 십자 4줄 + 회전 화살표</text>
<rect class="frame" x="30.0" y="650.0" width="860.0" height="490.0"/>
<text class="h" x="52.0" y="690.0" text-anchor="start">7. 변 투척</text>
<text class="p" x="52.0" y="718.0" text-anchor="start">본체의 네 변을 떼어 원궤도로 던진다</text>
