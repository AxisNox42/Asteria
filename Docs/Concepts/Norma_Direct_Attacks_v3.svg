<text class="t1" x="30.0" y="56.0" text-anchor="start">NORMA v3 · 직접 공격 5–8 (임시 본체)</text>
<text class="t2" x="30.0" y="92.0" text-anchor="start">레이저·연사·투척·괄호 · 모든 공격은 창 경계에서 막힌다 · 본체와 탄 모양은 임시</text>
<rect class="frame" x="30.0" y="130.0" width="860.0" height="490.0"/>
<text class="h" x="52.0" y="170.0" text-anchor="start">5. 방패 레이저</text>
<text class="p" x="52.0" y="198.0" text-anchor="start">창을 만들 때 쓰는 즉발 레이저를 플레이어에게 쏜다</text>
