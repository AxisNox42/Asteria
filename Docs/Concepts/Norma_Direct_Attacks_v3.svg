<text class="s" x="1365.0" y="1022.0" text-anchor="start">괄호가 조여 닫히는 순간 그 안에 있으면 피해</text>
<text class="p" x="935.0" y="1070.0" text-anchor="start">대응: 괄호가 다 조여지기 전에 사각형 밖으로 빠져나간다.</text>
<text class="p" x="935.0" y="1096.0" text-anchor="start">예고는 내 둘레 큰 괄호 + 안쪽으로 향하는 화살표</text>
<text class="hw" x="50.0" y="1170.0" text-anchor="start">보스 탄과 경계</text>
