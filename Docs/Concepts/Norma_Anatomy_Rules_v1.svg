<text class="s" x="280.0" y="1104.0" text-anchor="start">일반 몹 탄(작은 점)과 섞이지 않게 모양부터 다르게</text>
<rect class="frame" x="700.0" y="120.0" width="1070.0" height="1010.0"/>
<text class="h" x="722.0" y="160.0" text-anchor="start">B. 창 = 별도 공간</text>
<text class="p" x="722.0" y="188.0" text-anchor="start">창 안과 밖은 공격이 서로 닿지 않는다 · 경계를 넘는 것은 몹과 플레이어의 이동뿐</text>
<text class="hw" x="730.0" y="230.0" text-anchor="start">① 투사체는 경계에서 소멸</text>
