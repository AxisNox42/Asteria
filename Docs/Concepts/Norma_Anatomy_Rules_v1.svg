<text class="h" x="52.0" y="160.0" text-anchor="start">A. 본체</text>
<text class="p" x="52.0" y="188.0" text-anchor="start">속이 빈 마름모 코어 + ㄱ자 브래킷 4개 + 별 노드</text>
