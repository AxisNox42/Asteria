<text class="s" x="1240.0" y="780.0" text-anchor="start">겹친 영역은 앞 창 A의 공간</text>
<text class="s" x="1240.0" y="802.0" text-anchor="start">뒤 창 B의 테두리는 겹친 영역에서 그리지 않음</text>
<text class="s" x="1240.0" y="824.0" text-anchor="start"></text>
<text class="s" x="1240.0" y="846.0" text-anchor="start">창 순서가 바뀌면 겹친 영역의 소속도 바뀐다</text>
<text class="s" x="1240.0" y="868.0" text-anchor="start">(패턴 4의 재료)</text>
<text class="hw" x="730.0" y="985.0" text-anchor="start">읽는 법 (막 없이 선 두께·밝기로만)</text>
