<text class="s" x="1240.0" y="550.0" text-anchor="start">안타레스 돌진도 예외 없음</text>
<text class="s" x="1240.0" y="572.0" text-anchor="start">창 경계는 벽이 아니다 → 벽 충돌 기절 없이 통과</text>
<text class="s" x="1240.0" y="594.0" text-anchor="start">넘어온 뒤부터 같은 공간 규칙을 따름</text>
<text class="s" x="1240.0" y="616.0" text-anchor="start"></text>
<text class="s" x="1240.0" y="638.0" text-anchor="start">경계에 걸친 몹·플레이어는 중심점이 있는 쪽 소속</text>
<text class="s" x="1240.0" y="660.0" text-anchor="start"></text>
<text class="s" x="1240.0" y="682.0" text-anchor="start">플레이어도 창에 갇히지 않고 자유롭게 넘나든다</text>
<text class="hw" x="730.0" y="710.0" text-anchor="start">③ 창이 겹치면 앞 창이 겹친 영역을 가진다</text>
