<text class="s" x="1240.0" y="300.0" text-anchor="start">플레이어 탄 · 보스 탄 · 몹 탄 모두</text>
<text class="s" x="1240.0" y="322.0" text-anchor="start">경계에 닿으면 작은 별 조각으로 흩어짐</text>
<text class="s" x="1240.0" y="344.0" text-anchor="start"></text>
<text class="s" x="1240.0" y="366.0" text-anchor="start">전기장·폭발 같은 범위 공격도</text>
<text class="s" x="1240.0" y="388.0" text-anchor="start">경계에서 잘린다</text>
<text class="s" x="1240.0" y="410.0" text-anchor="start"></text>
<text class="s" x="1240.0" y="432.0" text-anchor="start">접촉 피해도 같은 공간끼리만</text>
<text class="hw" x="730.0" y="470.0" text-anchor="start">② 몹과 플레이어는 걸어서 넘나든다 — 넘는 순간 소속이 바뀜</text>
