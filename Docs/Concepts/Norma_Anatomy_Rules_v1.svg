<text class="t1" x="30.0" y="56.0" text-anchor="start">NORMA · 직각자자리 보스 — 구조와 창 공간 규칙</text>
<text class="t2" x="30.0" y="92.0" text-anchor="start">바탕화면의 창을 재고 차지하는 자 · 선으로만 그린다 · 면 채움·점선·가시 없음 · 모서리는 날카롭게</text>
