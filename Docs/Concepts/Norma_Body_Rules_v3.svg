<text class="p" x="935.0" y="590.0" text-anchor="start">창 위에는 레굴루스가 아군에게 씌우는 것과 같은 모서리 괄호만 남는다.</text>
<text class="p" x="935.0" y="616.0" text-anchor="start">보스와 창 사이에 계속 이어진 선은 없다. 창을 닫거나 순서를 바꾸거나</text>
<text class="p" x="935.0" y="642.0" text-anchor="start">반사를 걸 때만 같은 레이저가 다시 한 번 번쩍인다.</text>
<rect class="frame" x="30.0" y="700.0" width="1740.0" height="400.0"/>
<text class="h" x="52.0" y="740.0" text-anchor="start">C. 창 = 별도 공간 (확정 규칙)</text>
<text class="p" x="52.0" y="768.0" text-anchor="start">창 안과 밖은 공격이 서로 닿지 않는다 · 경계를 넘는 것은 몹과 플레이어의 이동뿐</text>
<text class="hw" x="60.0" y="810.0" text-anchor="start">① 투사체·레이저는 경계에서 소멸</text>
<rect class="d" x="290.0" y="840.0" width="240.0" height="170.0"/>
