<text class="s" x="60.0" y="1045.0" text-anchor="start">전기장·폭발도 경계에서 잘리고, 접촉 피해도 같은 공간끼리만 생긴다</text>
<text class="hw" x="640.0" y="810.0" text-anchor="start">② 몹과 플레이어는 걸어서 넘나든다</text>
