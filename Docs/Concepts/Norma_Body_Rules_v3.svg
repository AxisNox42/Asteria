<text class="s" x="640.0" y="1045.0" text-anchor="start">넘는 순간 소속이 바뀐다 · 경계에 걸치면 중심점 쪽 소속</text>
<text class="s" x="640.0" y="1067.0" text-anchor="start">안타레스 돌진도 예외 없음: 창 경계에서 기절하지 않고 통과</text>
<text class="hw" x="1220.0" y="810.0" text-anchor="start">③ 겹치면 앞 창이 겹친 영역을 가진다</text>
