<text class="t1" x="30.0" y="56.0" text-anchor="start">NORMA v3 · 임시 본체와 창 규칙</text>
<text class="t2" x="30.0" y="92.0" text-anchor="start">본체는 네모로 틀만 잡고 패턴을 먼저 구체화한다 · 공격하는 강화 레굴루스 방향은 유지</text>
<rect class="frame" x="30.0" y="120.0" width="860.0" height="560.0"/>
<text class="h" x="52.0" y="160.0" text-anchor="start">A. 임시 본체 — 네모</text>
<text class="p" x="52.0" y="188.0" text-anchor="start">외형은 패턴을 구체화한 뒤 정한다 · 지금은 크기·중심·판정 기준만 잡는다</text>
<rect class="it" x="187.0" y="277.0" width="286.0" height="286.0"/>
<circle class="i" cx="330.0" cy="420.0" r="13.2"/>
<text class="hi" x="330.0" y="600.0" text-anchor="middle">보스 본체 (임시)</text>
<text class="s" x="330.0" y="625.0" text-anchor="middle">정사각 테두리 + 중심점</text>
<text class="p" x="560.0" y="300.0" text-anchor="start">유지하는 방향</text>
<text class="p" x="560.0" y="328.0" text-anchor="start">· 레굴루스 계열: 얼음빛 청백색</text>
<text class="p" x="560.0" y="356.0" text-anchor="start">· 즉발 레이저와 모서리 괄호로</text>
<text class="p" x="560.0" y="384.0" text-anchor="start">  창을 만들고 명령한다</text>
<text class="p" x="560.0" y="412.0" text-anchor="start"></text>
<text class="p" x="560.0" y="440.0" text-anchor="start">임시로 두는 것</text>
<text class="p" x="560.0" y="468.0" text-anchor="start">· 본체 외형 (네모)</text>
<text class="p" x="560.0" y="496.0" text-anchor="start">· 보스 탄 모양 (작은 사각형)</text>
<text class="p" x="560.0" y="524.0" text-anchor="start">· 7번에서 던지는 것 = 네모의 네 변</text>
<rect class="frame" x="910.0" y="120.0" width="860.0" height="560.0"/>
<text class="h" x="932.0" y="160.0" text-anchor="start">B. 창과의 연결은 생성·명령하는 순간에만</text>
<text class="p" x="932.0" y="188.0" text-anchor="start">레굴루스가 보호막을 줄 때의 즉발 레이저와 괄호 조임 연출을 쓴다</text>
<rect class="scr" x="935.0" y="240.0" width="260.0" height="300.0"/>
